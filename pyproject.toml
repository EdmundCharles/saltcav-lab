[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "saltcav-lab"
version = "2.0.0"
description = "Моделирование и визуализация выщелачивания соляного канала в блоке NaCl"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ilya Zatsepin" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
saltcav = "saltcav.cli:main"
saltcav-web = "saltcav.web.server:launch_server"

[tool.hatch.build.targets.wheel]
packages = ["src/saltcav"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в docstring и комментариях

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/saltcav"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
